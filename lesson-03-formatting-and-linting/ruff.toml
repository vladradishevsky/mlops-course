# Установите максимально допустимую длину строки —

# Основные настройки
line-length = 120 # Максимальная длина строки для кода
indent-width = 4 # Ширина отступа


# Укажите целевую версию Python — важно для правильной работы ренеймера, парсера и проверки синтаксиса
target-version = "py311"

[lint]
# Выберите набор правил для анализа кода:
# E — ошибки стиля (pycodestyle)
# F — ошибки, связанные с переменными, импортами и т. д. (pyflakes)
# I — сортировка импортов (аналог isort)
# B — best practices из flake8-bugbear
select = [
    "UP",   # pyupgrade
    "I",    # isort
    "E",    # flake8-errors
    "W",    # flake8-warnings
    "F",    # flake8-pyflakes
    "B",    # flake8-bugbear
    #"C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    #"T20",  # flake8-print
    "T10",  # flake8-debugger
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff
    "DTZ",  # flake8-datetimez
    "ERA",  # eradicate
    "FURB", # refurb
]

[format]
# Use double quotes, like Black
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Format code examples in docstrings
docstring-code-format = true
